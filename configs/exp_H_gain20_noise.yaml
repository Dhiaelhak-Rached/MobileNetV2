run_name: exp_H_gain20_noise
seed: 42

audio:
  sample_rate: 16000
  window_seconds: 1.0
  n_fft: 1024
  win_length: 1024
  hop_length: 512
  n_mels: 128
  fmin: 50
  fmax: 8000

data:
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  norm_json: data/splits/normalization.json
  batch_size: 64
  num_workers: 4

model:
  pretrained: true
  dropout: 0.3

augment:
  specaug: true
  freq_mask: 16
  time_mask: 20
  gain:                 # random waveform gain (distance simulation), train-only
    enabled: true
    db_min: -20.0
    db_max: 0.0
  noise:                # exp_C noise mixing: random non_drone clip, train-only
    enabled: true
    prob: 0.5
    snr_min: 0
    snr_max: 20

train:
  epochs: 40
  freeze_epochs: 3      # head-only for 3 epochs, then full fine-tune
  lr_head: 1.0e-3
  lr_backbone: 1.0e-4
  lr_min: 1.0e-5
  weight_decay: 1.0e-2
  label_smoothing: 0.05
